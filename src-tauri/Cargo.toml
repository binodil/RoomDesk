[package]
name = "roomdesk"
version = "1.0.0"
description = "A 3D room desktop for Windows"
authors = ["Sardor"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

# The app code lives in a library so it can be shared by the desktop binary.
[lib]
name = "roomdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8"
base64 = "0.23"
tauri-plugin-opener = "2.7"
png = "0.18"
tauri-plugin-single-instance = "2"

# Windows-only: talk to Explorer to put the room behind the desktop icons.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Smaller, faster release build.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
